name: Compilar Flutter iOS

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-14
    
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Seleccionar Xcode más reciente disponible
        # firebase-ios-sdk >= 12.0.0 requiere Swift tools 6.1, que exige Xcode 16.3+.
        # Usamos "latest-stable" en vez de fijar una versión para no quedar cortos otra vez.
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Workaround para bug de Flutter con Swift Package Manager
        # flutter pub get intenta copiar los paquetes SPM de plugins (ej. firebase_messaging)
        # a build/ios/SourcePackages, pero falla si esa carpeta no existe en un checkout limpio.
        run: mkdir -p build/ios/SourcePackages

      - name: Instalar dependencias de Flutter
        run: flutter pub get

      - name: Compilar App para iOS
        # Este proyecto no tiene Podfile: usa Swift Package Manager, no CocoaPods,
        # así que no hace falta (ni funciona) un paso de "pod install".
        run: flutter build ios --release --no-codesign

      - name: Subir el resultado de la compilación
        uses: actions/upload-artifact@v4
        with:
          name: App-iOS-Build
          path: build/ios/iphoneos
name: Compilar Flutter iOS

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-14
    
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Seleccionar versión de Xcode (Xcode 16.1)
        run: |
          sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer
          xcodebuild -version

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Instalar dependencias del proyecto
        run: flutter pub get

      - name: Limpiar e Instalar dependencias de CocoaPods y SPM
        run: |
          cd ios
          pod deintegrate
          rm -rf Pods Podfile.lock .symlinks Flutter/Flutter.podspec
          # Forzar a Xcode a limpiar cachés antiguos de Swift Package Manager
          rm -rf ~/Library/Caches/org.swift.swiftpm
          rm -rf ~/Library/Developer/Xcode/DerivedData
          pod repo update
          pod install

      - name: Compilar App para iOS
        # Se añade la bandera para resolver SPM usando el nuevo entorno Xcode 16
        run: flutter build ios --release --no-codesign --pub